# Local Kafka for the streaming part of the project.
#   docker compose up -d        start (Kafka, the claims.events topic, REST Proxy)
#   docker compose ps           check everything is running
#   docker compose down         stop
#
#   kafka        Apache Kafka 3.9 broker, KRaft mode (no ZooKeeper)
#                  localhost:9092  for programs on your laptop (Spark, Python, .NET native producer)
#                  kafka:19092     for other containers
#   kafka-init   one-off: creates the claims.events topic (3 partitions), then exits
#   rest-proxy   Kafka REST Proxy on http://localhost:8082 - lets any program publish over plain HTTP.
#                BenefitHub's Claims.Api uses it, because the native Kafka client library (librdkafka)
#                isn't shipped for Windows on ARM.
#
# In AWS the broker is Amazon MSK; the topic name and message format stay the same.
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    container_name: claims-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: claims-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic claims.events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic claims.events

  rest-proxy:
    image: confluentinc/cp-kafka-rest:7.9.0
    hostname: rest-proxy
    container_name: claims-rest-proxy
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
